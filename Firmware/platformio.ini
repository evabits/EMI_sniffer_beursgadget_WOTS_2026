; PlatformIO project voor RP2354-hardware (EMIsniffer)
; WS2812-LED op GPIO22, aangestuurd via de PIO-backend van Adafruit NeoPixel.

[env:rp2354]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = generic_rp2350
framework = arduino
board_build.core = earlephilhower

; De RP2354 heeft 2 MB geintegreerde stacked flash.
; generic_rp2350 gaat standaard uit van 16 MB extern, dus hier corrigeren:
board_upload.maximum_size = 2097152
; Reserveer een FatFS-bestandssysteem voor calibration.txt.
; De firmware biedt dit via USB aan als schijf; bestand direct bewerken op de PC.
board_build.filesystem_size = 1m

; Board staat in BOOTSEL (USB mass-storage): UF2 naar het gemounte station kopieren.
; Bij een draaiend programma reset arduino-pico via 1200bps-touch vanzelf naar BOOTSEL.
upload_protocol = mbed

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
